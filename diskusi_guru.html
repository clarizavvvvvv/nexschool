<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Diskusi - Guru</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .grup-card {
            background: #fff;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 12px;
            border: 1px solid #e8edf3;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            transition: transform 0.2s;
        }
        .grup-card:hover {
            transform: translateX(4px);
            border-color: #2d6a9f;
        }
        .grup-card .grup-info {
            flex: 1;
        }
        .grup-card .grup-info h5 {
            margin: 0 0 4px;
        }
        .grup-card .grup-info small {
            color: #888;
        }
        .grup-card .grup-actions {
            display: flex;
            gap: 8px;
        }
        .btn-sm {
            padding: 4px 12px;
            font-size: 11px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-edit {
            background: #f5a623;
            color: #fff;
        }
        .btn-edit:hover {
            background: #d49520;
        }
        .btn-hapus {
            background: #dc3545;
            color: #fff;
        }
        .btn-hapus:hover {
            background: #c82333;
        }
        .btn-tugas {
            background: #28a745;
            color: #fff;
        }
        .btn-tugas:hover {
            background: #218838;
        }
        .btn-buat {
            background: #2d6a9f;
            color: #fff;
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }
        .btn-buat:hover {
            background: #1a4a7a;
        }
        .badge-siswa {
            background: #e8edf3;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
            color: #555;
            display: inline-block;
            margin: 2px 4px 2px 0;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: #fff;
            padding: 30px;
            border-radius: 16px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideIn 0.3s ease;
        }
        .modal-content h3 {
            margin-bottom: 16px;
        }
        .modal-content .input-group {
            margin-bottom: 14px;
        }
        .modal-content .input-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 4px;
        }
        .modal-content .input-group input,
        .modal-content .input-group textarea,
        .modal-content .input-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e7ef;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }
        .modal-content .input-group textarea {
            min-height: 60px;
            resize: vertical;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            justify-content: flex-end;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 16px 24px;
            border-radius: 10px;
            color: #fff;
            font-weight: 600;
            z-index: 99999;
            animation: slideUp 0.3s ease;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        }
        .toast.success { background: #28a745; }
        .toast.error { background: #dc3545; }
        .toast.info { background: #2d6a9f; }
        .toast.warning { background: #f5a623; }
        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #888;
        }
        .empty-state .icon {
            font-size: 60px;
            margin-bottom: 12px;
        }
        .stat-box {
            background: #fff;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .stat-box .number {
            font-size: 24px;
            font-weight: 700;
            color: #1a3a5c;
        }
        .stat-box small {
            color: #888;
            display: block;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div id="sidebarContainer"></div>
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        
        <div class="main-content">
            <div class="topbar">
                <div style="display:flex;align-items:center;gap:12px;">
                    <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                    <h3>🗨️ Kelola Diskusi</h3>
                </div>
                <div class="topbar-right">
                    <span style="color:#888;" id="tanggalDisplay"></span>
                    <div class="user-badge">
                        <img src="assets/default.png" alt="Foto" class="userFoto" onerror="this.style.display='none'">
                        <span class="userName">User</span>
                        <span style="background:#f5a623;color:#fff;font-size:10px;padding:2px 8px;border-radius:20px;">Guru</span>
                    </div>
                </div>
            </div>

            <!-- STATISTIK -->
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;">
                <div class="stat-box">
                    <div class="number" id="totalGrup">0</div>
                    <small>Total Grup</small>
                </div>
                <div class="stat-box">
                    <div class="number" id="totalTugas">0</div>
                    <small>Total Tugas</small>
                </div>
                <div class="stat-box">
                    <div class="number" id="totalSiswaGrup">0</div>
                    <small>Siswa Terdaftar</small>
                </div>
            </div>

            <!-- TOMBOL BUAT GRUP -->
            <div style="display:flex;justify-content:flex-end;margin-bottom:16px;">
                <button class="btn-buat" onclick="openBuatModal()">➕ Buat Grup Baru</button>
            </div>

            <!-- DAFTAR GRUP -->
            <div class="page-card">
                <h4>📋 Daftar Grup Diskusi</h4>
                <div id="grupList" style="margin-top:12px;">
                    <!-- Akan di-render oleh JavaScript -->
                </div>
            </div>

            <!-- DAFTAR TUGAS -->
            <div class="page-card">
                <h4>📝 Daftar Tugas Kelompok</h4>
                <div id="tugasList" style="margin-top:12px;">
                    <!-- Akan di-render oleh JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <!-- ===== MODAL BUAT GRUP ===== -->
    <div class="modal" id="buatModal">
        <div class="modal-content">
            <h3>➕ Buat Grup Diskusi Baru</h3>
            <div class="input-group">
                <label>📚 Nama Grup</label>
                <input type="text" id="inputNamaGrup" placeholder="Contoh: Matematika XII, Fisika XI">
            </div>
            <div class="input-group">
                <label>📝 Deskripsi</label>
                <textarea id="inputDeskripsi" placeholder="Deskripsi grup..."></textarea>
            </div>
            <div class="input-group">
                <label>👥 Mata Pelajaran</label>
                <select id="inputMapel">
                    <option value="Matematika">Matematika</option>
                    <option value="Fisika">Fisika</option>
                    <option value="Kimia">Kimia</option>
                    <option value="Biologi">Biologi</option>
                    <option value="Bahasa Indonesia">Bahasa Indonesia</option>
                    <option value="Bahasa Inggris">Bahasa Inggris</option>
                    <option value="Sejarah">Sejarah</option>
                    <option value="Geografi">Geografi</option>
                    <option value="Ekonomi">Ekonomi</option>
                    <option value="Sosiologi">Sosiologi</option>
                    <option value="PKN">PKN</option>
                    <option value="Agama">Agama</option>
                    <option value="Olahraga">Olahraga</option>
                    <option value="Seni Budaya">Seni Budaya</option>
                    <option value="Lainnya">Lainnya</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeBuatModal()">Batal</button>
                <button class="btn-buat" onclick="buatGrup()" style="background:#28a745;">✅ Buat</button>
            </div>
        </div>
    </div>

    <!-- ===== MODAL EDIT GRUP ===== -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <h3>✏️ Edit Grup</h3>
            <input type="hidden" id="editGrupId">
            <div class="input-group">
                <label>📚 Nama Grup</label>
                <input type="text" id="editNamaGrup">
            </div>
            <div class="input-group">
                <label>📝 Deskripsi</label>
                <textarea id="editDeskripsi"></textarea>
            </div>
            <div class="input-group">
                <label>👥 Mata Pelajaran</label>
                <select id="editMapel">
                    <option value="Matematika">Matematika</option>
                    <option value="Fisika">Fisika</option>
                    <option value="Kimia">Kimia</option>
                    <option value="Biologi">Biologi</option>
                    <option value="Bahasa Indonesia">Bahasa Indonesia</option>
                    <option value="Bahasa Inggris">Bahasa Inggris</option>
                    <option value="Sejarah">Sejarah</option>
                    <option value="Geografi">Geografi</option>
                    <option value="Ekonomi">Ekonomi</option>
                    <option value="Sosiologi">Sosiologi</option>
                    <option value="PKN">PKN</option>
                    <option value="Agama">Agama</option>
                    <option value="Olahraga">Olahraga</option>
                    <option value="Seni Budaya">Seni Budaya</option>
                    <option value="Lainnya">Lainnya</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeEditModal()">Batal</button>
                <button class="btn-edit" onclick="simpanEditGrup()" style="background:#f5a623;color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-weight:600;">💾 Simpan</button>
            </div>
        </div>
    </div>

    <!-- ===== MODAL TAMBAH TUGAS ===== -->
    <div class="modal" id="tugasModal">
        <div class="modal-content">
            <h3>📝 Tambah Tugas</h3>
            <input type="hidden" id="tugasGrupId">
            <div class="input-group">
                <label>📋 Judul Tugas</label>
                <input type="text" id="inputJudulTugas" placeholder="Contoh: Tugas Bab 5">
            </div>
            <div class="input-group">
                <label>📝 Deskripsi Tugas</label>
                <textarea id="inputDeskripsiTugas" placeholder="Deskripsi tugas..."></textarea>
            </div>
            <div class="input-group">
                <label>⏰ Deadline</label>
                <input type="datetime-local" id="inputDeadline">
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeTugasModal()">Batal</button>
                <button class="btn-tugas" onclick="tambahTugas()" style="background:#28a745;color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-weight:600;">📨 Kirim Tugas</button>
            </div>
        </div>
    </div>

    <!-- ===== MODAL HAPUS KONFIRMASI ===== -->
    <div class="modal" id="hapusModal">
        <div class="modal-content" style="text-align:center;">
            <div style="font-size:48px;">🗑️</div>
            <h3>Hapus Grup?</h3>
            <p id="hapusMessage" style="color:#666;margin:8px 0 16px;">Apakah Anda yakin ingin menghapus grup ini?</p>
            <div class="modal-actions" style="justify-content:center;">
                <button class="btn-secondary" onclick="closeHapusModal()">Batal</button>
                <button class="btn-hapus" id="confirmHapusBtn" onclick="confirmHapusGrup()">🗑️ Hapus</button>
            </div>
        </div>
    </div>

    <script>
    // ===== DATA GRUP DISKUSI =====
    let grupData = [];
    let tugasData = [];
    let hapusTargetId = null;

    // ===== LOAD DATA =====
    function loadData() {
        const storedGrup = localStorage.getItem('grupDiskusiData');
        if(storedGrup) {
            grupData = JSON.parse(storedGrup);
        } else {
            grupData = [
                { id: 1, nama: 'Matematika XII', deskripsi: 'Diskusi soal-soal matematika', mapel: 'Matematika', anggota: ['Ahmad Rizki', 'Siti Rahma'] },
                { id: 2, nama: 'Fisika XI', deskripsi: 'Pembahasan praktikum fisika', mapel: 'Fisika', anggota: ['Doni Pratama'] },
                { id: 3, nama: 'Bahasa Inggris', deskripsi: 'Latihan speaking & grammar', mapel: 'Bahasa Inggris', anggota: ['Ahmad Rizki'] }
            ];
            localStorage.setItem('grupDiskusiData', JSON.stringify(grupData));
        }

        const storedTugas = localStorage.getItem('tugasKelompokData');
        if(storedTugas) {
            tugasData = JSON.parse(storedTugas);
        } else {
            tugasData = [
                { id: 1, grupId: 1, judul: 'Tugas Bab 5', deskripsi: 'Kerjakan soal nomor 1-10', deadline: '2026-01-20T23:59' },
                { id: 2, grupId: 3, judul: 'Tugas Essay', deskripsi: 'Tulis essay tentang lingkungan', deadline: '2026-01-25T23:59' }
            ];
            localStorage.setItem('tugasKelompokData', JSON.stringify(tugasData));
        }
    }

    // ===== SAVE DATA =====
    function saveData() {
        localStorage.setItem('grupDiskusiData', JSON.stringify(grupData));
        localStorage.setItem('tugasKelompokData', JSON.stringify(tugasData));
    }

    // ===== RENDER GRUP =====
    function renderGrup() {
        const container = document.getElementById('grupList');
        if(!container) return;

        if(grupData.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="icon">📭</div>
                    <p>Belum ada grup diskusi.</p>
                    <p style="font-size:13px;">Klik "Buat Grup Baru" untuk membuat.</p>
                </div>
            `;
        } else {
            container.innerHTML = grupData.map(grup => `
                <div class="grup-card">
                    <div class="grup-info">
                        <h5>📚 ${grup.nama}</h5>
                        <small>📝 ${grup.deskripsi || 'Tidak ada deskripsi'}</small>
                        <br>
                        <small>📖 ${grup.mapel || '-'} | 👥 ${grup.anggota ? grup.anggota.length : 0} anggota</small>
                        <div style="margin-top:4px;">
                            ${grup.anggota && grup.anggota.map(a => `<span class="badge-siswa">${a}</span>`).join('')}
                        </div>
                    </div>
                    <div class="grup-actions">
                        <button class="btn-sm btn-tugas" onclick="openTugasModal(${grup.id})">📝 Tugas</button>
                        <button class="btn-sm btn-edit" onclick="openEditModal(${grup.id})">✏️ Edit</button>
                        <button class="btn-sm btn-hapus" onclick="openHapusModal(${grup.id})">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('totalGrup').textContent = grupData.length;
        let totalSiswa = 0;
        grupData.forEach(g => { if(g.anggota) totalSiswa += g.anggota.length; });
        document.getElementById('totalSiswaGrup').textContent = totalSiswa;
    }

    // ===== RENDER TUGAS =====
    function renderTugas() {
        const container = document.getElementById('tugasList');
        if(!container) return;

        if(tugasData.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="icon">📝</div>
                    <p>Belum ada tugas.</p>
                    <p style="font-size:13px;">Klik tombol "Tugas" di grup untuk menambahkan.</p>
                </div>
            `;
        } else {
            container.innerHTML = tugasData.map(tugas => {
                const grup = grupData.find(g => g.id === tugas.grupId);
                const deadline = new Date(tugas.deadline);
                const deadlineStr = deadline.toLocaleDateString('id-ID', {
                    day: 'numeric',
                    month: 'long',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
                return `
                    <div class="grup-card">
                        <div class="grup-info">
                            <h5>📝 ${tugas.judul}</h5>
                            <small>📖 ${grup ? grup.nama : 'Grup tidak ditemukan'}</small>
                            <br>
                            <small>⏰ Deadline: ${deadlineStr}</small>
                            <br>
                            <small style="color:#888;">${tugas.deskripsi || 'Tidak ada deskripsi'}</small>
                        </div>
                        <div class="grup-actions">
                            <button class="btn-sm btn-hapus" onclick="hapusTugas(${tugas.id})" style="background:#dc3545;color:#fff;border:none;padding:4px 12px;border-radius:4px;cursor:pointer;">🗑️</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        document.getElementById('totalTugas').textContent = tugasData.length;
    }

    // ===== BUAT GRUP =====
    function buatGrup() {
        const nama = document.getElementById('inputNamaGrup').value.trim();
        const deskripsi = document.getElementById('inputDeskripsi').value.trim();
        const mapel = document.getElementById('inputMapel').value;

        if(!nama) {
            showToast('⚠️ Nama grup harus diisi!', 'error');
            return;
        }

        const newGrup = {
            id: Date.now(),
            nama: nama,
            deskripsi: deskripsi || '-',
            mapel: mapel,
            anggota: []
        };

        grupData.push(newGrup);
        saveData();
        renderGrup();
        closeBuatModal();
        showToast(`✅ Grup "${nama}" berhasil dibuat!`, 'success');
    }

    // ===== BUKA MODAL BUAT =====
    function openBuatModal() {
        document.getElementById('buatModal').classList.add('active');
        document.getElementById('inputNamaGrup').value = '';
        document.getElementById('inputDeskripsi').value = '';
        document.getElementById('inputNamaGrup').focus();
    }

    function closeBuatModal() {
        document.getElementById('buatModal').classList.remove('active');
    }

    // ===== BUKA MODAL EDIT =====
    function openEditModal(id) {
        const grup = grupData.find(g => g.id === id);
        if(!grup) return;

        document.getElementById('editGrupId').value = id;
        document.getElementById('editNamaGrup').value = grup.nama;
        document.getElementById('editDeskripsi').value = grup.deskripsi || '';
        document.getElementById('editMapel').value = grup.mapel || 'Matematika';
        document.getElementById('editModal').classList.add('active');
    }

    function closeEditModal() {
        document.getElementById('editModal').classList.remove('active');
    }

    function simpanEditGrup() {
        const id = parseInt(document.getElementById('editGrupId').value);
        const nama = document.getElementById('editNamaGrup').value.trim();
        const deskripsi = document.getElementById('editDeskripsi').value.trim();
        const mapel = document.getElementById('editMapel').value;

        if(!nama) {
            showToast('⚠️ Nama grup harus diisi!', 'error');
            return;
        }

        const grup = grupData.find(g => g.id === id);
        if(!grup) return;

        grup.nama = nama;
        grup.deskripsi = deskripsi || '-';
        grup.mapel = mapel;

        saveData();
        renderGrup();
        closeEditModal();
        showToast(`✅ Grup "${nama}" berhasil diupdate!`, 'success');
    }

    // ===== BUKA MODAL HAPUS =====
    function openHapusModal(id) {
        const grup = grupData.find(g => g.id === id);
        if(!grup) return;

        hapusTargetId = id;
        document.getElementById('hapusMessage').textContent = 
            `Apakah Anda yakin ingin menghapus grup "${grup.nama}"? Semua tugas di grup ini juga akan terhapus.`;
        document.getElementById('hapusModal').classList.add('active');
    }

    function closeHapusModal() {
        document.getElementById('hapusModal').classList.remove('active');
        hapusTargetId = null;
    }

    function confirmHapusGrup() {
        if(hapusTargetId === null) return;

        const grup = grupData.find(g => g.id === hapusTargetId);
        if(!grup) return;

        // Hapus tugas terkait
        tugasData = tugasData.filter(t => t.grupId !== hapusTargetId);

        // Hapus grup
        grupData = grupData.filter(g => g.id !== hapusTargetId);

        saveData();
        renderGrup();
        renderTugas();
        closeHapusModal();
        showToast(`🗑️ Grup "${grup.nama}" berhasil dihapus!`, 'info');
    }

    // ===== MODAL TUGAS =====
    function openTugasModal(grupId) {
        const grup = grupData.find(g => g.id === grupid);
        if(!grup) {
            showToast('⚠️ Grup tidak ditemukan!', 'error');
            return;
        }

        document.getElementById('tugasGrupId').value = grupid;
        document.getElementById('inputJudulTugas').value = '';
        document.getElementById('inputDeskripsiTugas').value = '';
        document.getElementById('inputDeadline').value = '';
        document.getElementById('tugasModal').classList.add('active');
        document.getElementById('inputJudulTugas').focus();
    }

    function closeTugasModal() {
        document.getElementById('tugasModal').classList.remove('active');
    }

    function tambahTugas() {
        const grupId = parseInt(document.getElementById('tugasGrupId').value);
        const judul = document.getElementById('inputJudulTugas').value.trim();
        const deskripsi = document.getElementById('inputDeskripsiTugas').value.trim();
        const deadline = document.getElementById('inputDeadline').value;

        if(!judul) {
            showToast('⚠️ Judul tugas harus diisi!', 'error');
            return;
        }

        if(!deadline) {
            showToast('⚠️ Deadline harus diisi!', 'error');
            return;
        }

        const newTugas = {
            id: Date.now(),
            grupId: grupId,
            judul: judul,
            deskripsi: deskripsi || '-',
            deadline: deadline
        };

        tugasData.push(newTugas);
        saveData();
        renderTugas();
        closeTugasModal();
        showToast(`✅ Tugas "${judul}" berhasil ditambahkan!`, 'success');
    }

    // ===== HAPUS TUGAS =====
    function hapusTugas(id) {
        if(!confirm('Yakin ingin menghapus tugas ini?')) return;

        const tugas = tugasData.find(t => t.id === id);
        if(!tugas) return;

        tugasData = tugasData.filter(t => t.id !== id);
        saveData();
        renderTugas();
        showToast(`🗑️ Tugas "${tugas.judul}" berhasil dihapus!`, 'info');
    }

    // ===== SHOW TOAST =====
    function showToast(message, type = 'success') {
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.textContent = message;
        document.body.appendChild(toast);

        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transition = 'opacity 0.5s';
            setTimeout(() => toast.remove(), 500);
        }, 4000);
    }

    // ===== CEK LOGIN =====
    function checkLogin() {
        const isLoggedIn = localStorage.getItem('isLoggedIn');
        if(!isLoggedIn || isLoggedIn !== 'true') {
            window.location.href = 'index.html';
            return false;
        }
        const user = JSON.parse(localStorage.getItem('user'));
        if(user && user.role === 'siswa') {
            window.location.href = 'diskusi_siswa.html';
            return false;
        }
        return true;
    }

    // ===== GET USER DATA =====
    function getUserData() {
        const user = localStorage.getItem('user');
        return user ? JSON.parse(user) : null;
    }

    // ===== UPDATE USER BADGE =====
    function updateUserBadge() {
        const user = getUserData();
        if(user) {
            document.querySelectorAll('.userName').forEach(el => el.textContent = user.name);
            document.querySelectorAll('.userFoto').forEach(el => {
                el.src = `assets/${user.foto || 'default.png'}`;
            });
        }
    }

    // ===== TANGGAL =====
    function updateDate() {
        const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
        document.getElementById('tanggalDisplay').textContent = new Date().toLocaleDateString('id-ID', options);
    }

    // ===== LOAD SIDEBAR =====
    function loadSidebar() {
        const container = document.getElementById('sidebarContainer');
        if(!container) return;
        fetch('partials/sidebar_guru.html')
            .then(response => response.text())
            .then(html => {
                container.innerHTML = html;
                document.querySelectorAll('.sidebar-menu a').forEach(link => {
                    if(link.getAttribute('href') === 'diskusi_guru.html') {
                        link.classList.add('active');
                    }
                });
                updateUserBadge();
            });
    }

    // ===== TOGGLE SIDEBAR =====
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        if(sidebar && overlay) {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }
    }

    // ===== INIT =====
    document.addEventListener('DOMContentLoaded', function() {
        if(!checkLogin()) return;
        loadData();
        loadSidebar();
        updateDate();
        updateUserBadge();
        renderGrup();
        renderTugas();

        // Tutup modal dengan ESC
        document.addEventListener('keydown', function(e) {
            if(e.key === 'Escape') {
                closeBuatModal();
                closeEditModal();
                closeTugasModal();
                closeHapusModal();
            }
        });

        // Tutup modal klik di luar
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', function(e) {
                if(e.target === this) {
                    this.classList.remove('active');
                }
            });
        });

        const overlay = document.getElementById('sidebarOverlay');
        if(overlay) {
            overlay.addEventListener('click', function() {
                const sidebar = document.getElementById('sidebar');
                if(sidebar) sidebar.classList.remove('open');
                overlay.classList.remove('active');
            });
        }
    });
    </script>
</body>
</html>
