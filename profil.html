<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil - NexSchool</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body id="appBody">
    <div class="app-container">
        <div id="sidebarContainer"></div>
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        
        <div class="main-content">
            <div class="topbar">
                <div style="display:flex;align-items:center;gap:12px;">
                    <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                    <h3>👤 Profil Saya</h3>
                </div>
                <div class="topbar-right">
                    <span style="color:#888;" id="tanggalDisplay"></span>
                    <div class="user-badge">
                        <img src="assets/default.png" alt="Foto" class="userFoto" onerror="this.style.display='none'">
                        <span class="userName">User</span>
                        <span id="roleBadge" style="background:#2d6a9f;color:#fff;font-size:10px;padding:2px 8px;border-radius:20px;">Siswa</span>
                    </div>
                </div>
            </div>
            
            <div class="profile-header">
                <div>
                    <img src="assets/default.png" alt="Foto" id="profilFoto" style="width:100px;height:100px;border-radius:50%;object-fit:cover;background:#2d6a9f;">
                </div>
                <div style="flex:1;">
                    <h3 id="profileName">User</h3>
                    <p style="color:#888;margin:4px 0;">
                        <strong id="profileLabel">NIS:</strong> <span id="profileNis">-</span>
                    </p>
                    <p style="color:#888;font-size:14px;" id="profileKelas">Kelas: -</p>
                    <span id="roleDisplay" style="display:inline-block;padding:4px 16px;border-radius:20px;font-size:12px;font-weight:600;">Siswa</span>
                </div>
            </div>
            
            <div class="page-card">
                <h4>✏️ Edit Profil</h4>
                <form id="editProfilForm">
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                        <div>
                            <label style="font-size:13px;font-weight:600;">Nama Lengkap</label>
                            <input type="text" id="editNama" style="width:100%;padding:10px;border:2px solid #e0e7ef;border-radius:8px;">
                        </div>
                        <div>
                            <label style="font-size:13px;font-weight:600;">Kelas</label>
                            <input type="text" id="editKelas" style="width:100%;padding:10px;border:2px solid #e0e7ef;border-radius:8px;">
                        </div>
                    </div>
                    <button type="submit" class="btn-primary" style="margin-top:12px;">💾 Simpan</button>
                </form>
            </div>
            
            <div class="page-card">
                <h4>⚙️ Pengaturan</h4>
                <div style="display:flex;flex-direction:column;gap:12px;">
                    <label style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:8px 0;border-bottom:1px solid #f0f4f8;">
                        <input type="checkbox" id="modeGelap" style="width:18px;height:18px;"> 🌙 Mode Gelap
                    </label>
                    <button class="btn-secondary" id="gantiPassword" style="cursor:pointer;">🔑 Ganti Password</button>
                </div>
            </div>
        </div>
    </div>

    <script>
    // ===== LOAD PROFIL =====
    function loadProfile() {
        const user = JSON.parse(localStorage.getItem('user'));
        if(!user) return;
        
        const isGuru = user.role === 'guru';
        
        document.getElementById('profileName').textContent = user.name;
        document.getElementById('profileNis').textContent = user.nis;
        document.getElementById('profileLabel').textContent = isGuru ? 'NIP:' : 'NIS:';
        document.getElementById('profileKelas').textContent = isGuru ? 'Guru' : `Kelas: ${user.kelas}`;
        document.getElementById('editNama').value = user.name;
        document.getElementById('editKelas').value = user.kelas || '';
        
        const roleDisplay = document.getElementById('roleDisplay');
        if(isGuru) {
            roleDisplay.textContent = '👨‍🏫 Guru';
            roleDisplay.style.background = '#f5a623';
            roleDisplay.style.color = '#fff';
            document.getElementById('roleBadge').textContent = 'Guru';
            document.getElementById('roleBadge').style.background = '#f5a623';
        } else {
            roleDisplay.textContent = '👨‍🎓 Siswa';
            roleDisplay.style.background = '#28a745';
            roleDisplay.style.color = '#fff';
            document.getElementById('roleBadge').textContent = 'Siswa';
            document.getElementById('roleBadge').style.background = '#28a745';
        }
        
        document.querySelectorAll('.userName').forEach(el => el.textContent = user.name);
        document.querySelectorAll('.userFoto').forEach(el => {
            el.src = `assets/${user.foto || 'default.png'}`;
        });
        document.getElementById('profilFoto').src = `assets/${user.foto || 'default.png'}`;
    }
    
    // ===== EDIT PROFIL =====
    document.getElementById('editProfilForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const nama = document.getElementById('editNama').value.trim();
        const kelas = document.getElementById('editKelas').value.trim();
        
        if(!nama) {
            alert('⚠️ Nama tidak boleh kosong!');
            return;
        }
        
        const user = JSON.parse(localStorage.getItem('user'));
        user.name = nama;
        if(user.role === 'siswa') user.kelas = kelas || '-';
        localStorage.setItem('user', JSON.stringify(user));
        
        alert('✅ Profil berhasil diperbarui!');
        loadProfile();
    });
    
    // ===== MODE GELAP =====
    document.addEventListener('DOMContentLoaded', function() {
        const modeGelap = document.getElementById('modeGelap');
        const body = document.getElementById('appBody');
        
        if(localStorage.getItem('darkMode') === 'enabled') {
            body.classList.add('dark-mode');
            modeGelap.checked = true;
        }
        
        modeGelap.addEventListener('change', function() {
            if(this.checked) {
                body.classList.add('dark-mode');
                localStorage.setItem('darkMode', 'enabled');
            } else {
                body.classList.remove('dark-mode');
                localStorage.setItem('darkMode', 'disabled');
            }
        });
        
        // ===== GANTI PASSWORD =====
        document.getElementById('gantiPassword').addEventListener('click', function() {
            const newPass = prompt('🔑 Masukkan Password Baru (minimal 6 karakter):');
            if(newPass !== null && newPass.length >= 6) {
                localStorage.setItem('savedPassword', newPass);
                alert('✅ Password berhasil diubah!');
            } else if(newPass !== null && newPass.length < 6) {
                alert('❌ Password minimal 6 karakter!');
            }
        });
    });
    
    // ===== CEK LOGIN =====
    function checkLogin() {
        const isLoggedIn = localStorage.getItem('isLoggedIn');
        if(!isLoggedIn || isLoggedIn !== 'true') {
            window.location.href = 'index.html';
            return false;
        }
        return true;
    }
    
    // ===== LOAD SIDEBAR =====
    function loadSidebar() {
        const container = document.getElementById('sidebarContainer');
        if(!container) return;
        const user = JSON.parse(localStorage.getItem('user'));
        const file = user && user.role === 'guru' ? 'partials/sidebar_guru.html' : 'partials/sidebar_siswa.html';
        
        fetch(file)
            .then(response => response.text())
            .then(html => {
                container.innerHTML = html;
                document.querySelectorAll('.sidebar-menu a').forEach(link => {
                    if(link.getAttribute('href') === 'profil.html') link.classList.add('active');
                });
            });
    }
    
    // ===== TOGGLE SIDEBAR =====
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        if(sidebar && overlay) {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }
    }
    
    // ===== TANGGAL =====
    function updateDate() {
        const options = { day: 'numeric', month: 'long', year: 'numeric' };
        document.getElementById('tanggalDisplay').textContent = new Date().toLocaleDateString('id-ID', options);
    }
    
    // ===== INIT =====
    document.addEventListener('DOMContentLoaded', function() {
        if(!checkLogin()) return;
        loadSidebar();
        loadProfile();
        updateDate();
        
        const overlay = document.getElementById('sidebarOverlay');
        if(overlay) {
            overlay.addEventListener('click', function() {
                const sidebar = document.getElementById('sidebar');
                if(sidebar) sidebar.classList.remove('open');
                overlay.classList.remove('active');
            });
        }
    });
    </script>
    <script src="js/logout.js"></script>
</body>
</html>
