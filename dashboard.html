<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NexSchool</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <div class="login-logo">
                <img src="assets/default.png" alt="NexSchool" style="width:60px;height:60px;border-radius:50%;background:#2d6a9f;padding:10px;">
                <h1>Nex<span>School</span></h1>
                <p>Belajar & Berkembang Bersama</p>
            </div>
            
            <form id="loginForm">
                <div class="input-group">
                    <label>📝 NIS / NIP</label>
                    <input type="text" id="nis" placeholder="Masukkan NIS (Siswa) atau NIP (Guru)" required>
                </div>
                <div class="input-group">
                    <label>👤 Nama Lengkap</label>
                    <input type="text" id="nama" placeholder="Masukkan Nama Lengkap" required>
                </div>
                
                <div id="loginError" class="error-msg" style="display:none;">❌ NIS/NIP atau Nama salah!</div>
                
                <button type="submit" class="btn-primary btn-block">Masuk</button>
                
                <div class="login-options">
                    <a href="#" id="guestLogin">Masuk sebagai Tamu</a>
                </div>
            </form>
            
            <div class="login-footer">
                <small>&copy; 2026 NexSchool - Platform Belajar Digital</small>
            </div>
        </div>
    </div>

    <script>
    // ===== DATA USER (Hardcoded untuk Demo) =====
    const USERS = {
        // GURU
        '2026001': { 
            nama: 'Budi Santoso', 
            role: 'guru', 
            kelas: '-',
            foto: 'default.png'
        },
        '2026002': { 
            nama: 'Ani Wijaya', 
            role: 'guru', 
            kelas: '-',
            foto: 'default.png'
        },
        // SISWA
        '2026003': { 
            nama: 'Ahmad Rizki', 
            role: 'siswa', 
            kelas: 'XII IPA 1',
            foto: 'default.png'
        },
        '2026004': { 
            nama: 'Siti Rahma', 
            role: 'siswa', 
            kelas: 'XII IPA 2',
            foto: 'default.png'
        },
        '2026005': { 
            nama: 'Doni Pratama', 
            role: 'siswa', 
            kelas: 'XI IPS 1',
            foto: 'default.png'
        }
    };

    // ===== CEK SUDAH LOGIN =====
    (function() {
        const isLoggedIn = localStorage.getItem('isLoggedIn');
        if(isLoggedIn === 'true') {
            const user = JSON.parse(localStorage.getItem('user'));
            if(user && user.role === 'guru') {
                window.location.href = 'dashboard_guru.html';
            } else if(user && user.role === 'siswa') {
                window.location.href = 'dashboard_siswa.html';
            }
        }
    })();

    // ===== LOGIN HANDLER =====
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const nis = document.getElementById('nis').value.trim();
        const nama = document.getElementById('nama').value.trim();
        const errorDiv = document.getElementById('loginError');
        
        if(!nis || !nama) {
            errorDiv.textContent = '⚠️ NIS/NIP dan Nama harus diisi!';
            errorDiv.style.display = 'block';
            return;
        }
        
        // Cek user di database
        const user = USERS[nis];
        
        if(user && user.nama.toLowerCase() === nama.toLowerCase()) {
            // Simpan ke localStorage
            const userData = {
                nis: nis,
                name: user.nama,
                role: user.role,
                kelas: user.kelas,
                foto: user.foto
            };
            localStorage.setItem('user', JSON.stringify(userData));
            localStorage.setItem('isLoggedIn', 'true');
            
            // Redirect berdasarkan role
            if(user.role === 'guru') {
                window.location.href = 'dashboard_guru.html';
            } else {
                window.location.href = 'dashboard_siswa.html';
            }
        } else {
            errorDiv.textContent = '❌ NIS/NIP atau Nama salah!';
            errorDiv.style.display = 'block';
        }
    });
    
    // ===== MASUK SEBAGAI TAMU =====
    document.getElementById('guestLogin').addEventListener('click', function(e) {
        e.preventDefault();
        if(confirm('Masuk sebagai tamu? Akses terbatas.')) {
            const guestData = {
                nis: 'GUEST001',
                name: 'Tamu NexSchool',
                role: 'tamu',
                kelas: '-',
                foto: 'default.png',
                isGuest: true
            };
            localStorage.setItem('user', JSON.stringify(guestData));
            localStorage.setItem('isLoggedIn', 'true');
            window.location.href = 'dashboard_siswa.html';
        }
    });
    </script>
</body>
</html>
